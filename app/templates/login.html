<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SiteScout AI - Login</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           background: #f3f4f6; font-family: system-ui, Arial, sans-serif; }
    .card { background: #fff; width: 100%; max-width: 360px; margin: 16px; padding: 28px;
            border-radius: 10px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
    h1 { margin: 0 0 4px; font-size: 22px; }
    p.sub { margin: 0 0 20px; color: #6b7280; font-size: 14px; }
    label { display: block; margin: 12px 0 4px; font-size: 14px; }
    input { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 15px; }
    button { width: 100%; margin-top: 18px; padding: 11px; border: 0; border-radius: 6px;
             background: #2563eb; color: #fff; font-size: 15px; cursor: pointer; }
    .error { background: #fee2e2; color: #991b1b; padding: 10px; border-radius: 6px;
             margin-bottom: 8px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>SiteScout AI</h1>
    <p class="sub">Admin login</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Login</button>
    </form>
  </div>
</body>
</html>
